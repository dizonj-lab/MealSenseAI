# Frontend: serves the React app and reverse-proxies the API (single entry point)
# Rate limits per client IP (Cloudflare forwards the visitor IP in CF-Connecting-IP when tunnelled)
map $http_cf_connecting_ip $client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
limit_req_zone $client_ip zone=analyze:10m rate=20r/m;
limit_req_zone $client_ip zone=general:10m rate=10r/s;

server {
    listen 80;
    client_max_body_size 30m;           # two photos up to 12 MB each
    proxy_read_timeout 120s;            # analysis can take a few seconds on CPU

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    limit_req_status 429;

    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
    }
    location ~ ^/api/v1/meals/(capture|analyze) {
        limit_req zone=analyze burst=10 nodelay;
        proxy_read_timeout 300s;        # analysis on slow/emulated CPUs
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
    }
    location ~ ^/(api/|docs|redoc|openapi.json) {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {                        # single-page app
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location = /nginx-health { return 200 "ok\n"; }
}
