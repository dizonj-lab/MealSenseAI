# Isolated test environment (separate project, throwaway data). Run: ./scripts/test.sh
name: mealsenseai-test

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://mealsense:mealsense@db:5432/mealsenseai
  JWT_SECRET: test-only
  OLLAMA_URL: http://127.0.0.1:9            # SLM deliberately offline: tests cover the rule-based fallback
  INFERENCE_DEVICE: cpu
  DATA_DIR: /data

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mealsense, POSTGRES_PASSWORD: mealsense, POSTGRES_DB: mealsenseai }
    command: ["postgres", "-c", "fsync=off"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mealsense -d mealsenseai"], interval: 3s, retries: 20 }
  db-init:                                  # extra database for the API test suite
    image: postgres:16-alpine
    environment: { PGPASSWORD: mealsense }
    entrypoint: ["sh", "-c", "psql -h db -U mealsense -d mealsenseai -tc \"select 1 from pg_database where datname='mealsenseai_test'\" | grep -q 1 || psql -h db -U mealsense -d mealsenseai -c 'create database mealsenseai_test'"]
    depends_on: { db: { condition: service_healthy } }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile, target: cpu }
    image: mealsenseai-test/backend:local
    environment: *backend-env
    tmpfs: ["/data:uid=10001"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: mealsenseai-test/frontend:local
    ports: ["${TEST_HTTP_PORT:-8081}:80"]
    depends_on: { backend: { condition: service_healthy } }

  api-tests:                                # pytest: model/taxonomy, auth, onboarding, inference, corrections, forecast
    build: { context: ., dockerfile: backend/Dockerfile, target: test }
    image: mealsenseai/backend-test:local
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://mealsense:mealsense@db:5432/mealsenseai_test
    tmpfs: ["/data:uid=10001"]
    profiles: [tests]
    depends_on: { db-init: { condition: service_completed_successfully } }

  e2e:                                      # Playwright: full mobile UI flow through nginx
    build: { context: ., dockerfile: infrastructure/e2e.Dockerfile }
    image: mealsenseai/e2e:local
    volumes:
      - ./backend/tests:/work/tests:ro
      - ./test-results:/results
    command: ["python", "tests/e2e/ui_flow.py", "http://frontend", "/results/screenshots"]
    profiles: [tests]
    depends_on: { frontend: { condition: service_started } }
