# Isolated test environment (separate project, throwaway data). Run: ./infrastructure/test.sh
name: mealsenseai-test

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://mealsense:mealsense@db:5432/mealsenseai
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: test-only
  OLLAMA_URL: http://127.0.0.1:9            # SLM deliberately offline: tests cover the rule-based fallback
  DATA_DIR: /data

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mealsense, POSTGRES_PASSWORD: mealsense, POSTGRES_DB: mealsenseai }
    command: ["postgres", "-c", "fsync=off"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mealsense -d mealsenseai"], interval: 3s, retries: 20 }
  db-init:                                  # extra database for the API test suite
    image: postgres:16-alpine
    environment: { PGPASSWORD: mealsense }
    entrypoint: ["sh", "-c", "psql -h db -U mealsense -d mealsenseai -tc \"select 1 from pg_database where datname='mealsenseai_test'\" | grep -q 1 || psql -h db -U mealsense -d mealsenseai -c 'create database mealsenseai_test'"]
    depends_on: { db: { condition: service_healthy } }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  app:
    build: { context: ., dockerfile: infrastructure/Dockerfile, target: runtime }
    image: mealsenseai/app:local
    environment: *app-env
    tmpfs: [/data]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
  proxy:
    image: nginx:1.27-alpine
    ports: ["${TEST_HTTP_PORT:-8081}:80"]
    volumes: ["./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: { app: { condition: service_healthy } }

  api-tests:                                # pytest: auth, onboarding, inference, corrections, portions
    build: { context: ., dockerfile: infrastructure/Dockerfile, target: test }
    image: mealsenseai/app-test:local
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://mealsense:mealsense@db:5432/mealsenseai_test
    tmpfs: [/data]
    profiles: [tests]
    depends_on: { db-init: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  e2e:                                      # Playwright: full mobile UI flow through the reverse proxy
    build: { context: ., dockerfile: infrastructure/e2e.Dockerfile }
    image: mealsenseai/e2e:local
    volumes:
      - ./backend/tests:/work/tests:ro
      - ./test-results:/results
    command: ["python", "tests/e2e/ui_flow.py", "http://proxy", "/results/screenshots"]
    profiles: [tests]
    depends_on: { proxy: { condition: service_started } }
