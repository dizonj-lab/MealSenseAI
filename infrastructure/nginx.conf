# Reverse proxy: single entry point for the web UI and API
server {
    listen 80;
    client_max_body_size 30m;           # two photos up to 12 MB each
    proxy_read_timeout 120s;            # analysis can take a few seconds on CPU

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /nginx-health { return 200 "ok\n"; }
}
