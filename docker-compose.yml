# MealSenseAI — Docker Compose (CPU by default; no external APIs or runtime downloads needed)
#   ./scripts/start.sh            or   docker compose up -d --build      -> http://localhost:8080
#   GPU (optional, NVIDIA):          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
name: mealsenseai
# Images are named after the project, so a second copy started with COMPOSE_PROJECT_NAME=<other> (e.g. an acceptance run)
# builds its own images and never replaces the ones the live stack uses.

services:
  frontend:                         # React UI + nginx reverse proxy (single entry point)
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-mealsenseai}/frontend:local
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"]
    depends_on: { backend: { condition: service_healthy } }
    restart: unless-stopped

  backend:                          # FastAPI, EXP-002 classifier, nutrition & insights, migrations on start
    build: { context: ., dockerfile: backend/Dockerfile, target: cpu }
    image: ${COMPOSE_PROJECT_NAME:-mealsenseai}/backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://mealsense:${POSTGRES_PASSWORD:-mealsense}@db:5432/mealsenseai
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      REDIS_URL: ${REDIS_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:9}     # optional local SLM; unreachable = rule-based fallback
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
      CONTACT_TO: ${CONTACT_TO:-joel.dizon@live.com}   # contact-form messages are stored, and emailed here when SMTP_HOST is set
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}                        # e.g. https://mealsense.xtangent.ai, for links in verification emails
    volumes: ["uploads:/data"]      # meal photos
    depends_on: { db: { condition: service_healthy }, init-perms: { condition: service_completed_successfully } }
    restart: unless-stopped

  init-perms:                       # one-shot: photo volume owned by the non-root backend user (also fixes old volumes)
    image: ${COMPOSE_PROJECT_NAME:-mealsenseai}/backend:local
    user: root
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes: ["uploads:/data"]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mealsense, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mealsense}", POSTGRES_DB: mealsenseai }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mealsense -d mealsenseai"], interval: 5s, retries: 20 }
    restart: unless-stopped

  redis:                            # optional cache (profile "cache"); set REDIS_URL=redis://redis:6379/0
    image: redis:7-alpine
    profiles: [cache]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

  ollama:                           # optional local SLM (profile "slm"); set OLLAMA_URL=http://ollama:11434
    image: ollama/ollama:0.12.6
    profiles: [slm]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: [slm]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "${OLLAMA_PULL_MODEL:-qwen2.5:1.5b}"]
    depends_on: [ollama]
    restart: "no"

volumes: { pgdata: {}, uploads: {}, redisdata: {}, ollama: {} }
