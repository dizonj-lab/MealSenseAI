services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mealsense, POSTGRES_PASSWORD: mealsense, POSTGRES_DB: mealsenseai }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mealsense"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  app:
    build: { context: ., dockerfile: infrastructure/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://mealsense:mealsense@db:5432/mealsenseai
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DATA_DIR: /data
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [uploads:/data]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
volumes: { pgdata: {}, redisdata: {}, uploads: {} }
