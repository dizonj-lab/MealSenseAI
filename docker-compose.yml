# MealSenseAI local infrastructure (single machine, Docker Compose)
#   docker compose up -d --build                 -> http://localhost:8080
#   docker compose --profile slm up -d --build   -> also runs Ollama in a container
name: mealsenseai

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://mealsense:${POSTGRES_PASSWORD:-mealsense}@db:5432/mealsenseai
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  DATA_DIR: /data

services:
  proxy:                                    # reverse proxy / single entry point
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: { app: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"], interval: 10s, retries: 5 }
    restart: unless-stopped

  app:                                      # web UI + FastAPI API + vision inference (CPU)
    build: { context: ., dockerfile: infrastructure/Dockerfile, target: runtime }
    image: mealsenseai/app:local
    environment: *app-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - uploads:/data                       # meal images (local object storage)
      - ./ml/models:/app/ml/models:ro       # model store (retrain -> restart app)
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  db:                                       # users, profiles, meals, corrections, metrics
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mealsense, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mealsense}", POSTGRES_DB: mealsenseai }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mealsense -d mealsenseai"], interval: 5s, retries: 10 }
    restart: unless-stopped

  redis:                                    # cache for nutrition lookups and SLM responses
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

  ollama:                                   # optional local SLM (set OLLAMA_URL=http://ollama:11434)
    image: ollama/ollama:0.12.6
    profiles: [slm]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

  ollama-pull:                              # one-shot: download the SLM model into the ollama volume
    image: ollama/ollama:0.12.6
    profiles: [slm]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "${OLLAMA_PULL_MODEL:-qwen2.5:1.5b}"]
    depends_on: [ollama]
    restart: "no"

volumes: { pgdata: {}, redisdata: {}, uploads: {}, ollama: {} }
