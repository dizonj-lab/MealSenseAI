# Optional NVIDIA GPU acceleration (development workstation). Requires the NVIDIA Container Toolkit.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile, target: gpu }
    image: ${COMPOSE_PROJECT_NAME:-mealsenseai}/backend:gpu
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  init-perms:
    image: ${COMPOSE_PROJECT_NAME:-mealsenseai}/backend:gpu
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
